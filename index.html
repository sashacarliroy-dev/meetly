<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meetly — Count me in.</title>
<meta name="description" content="Find the people you need to complete your group — padel, football, board games, and more. Built for students & young adults in Bordeaux.">
<meta property="og:type" content="website">
<meta property="og:title" content="Meetly — Count me in.">
<meta property="og:description" content="Find the people you need to complete your group — padel, football, board games, and more.">
<meta property="og:image" content="https://sashacarliroy-dev.github.io/meetly/og-image.png">
<meta property="og:url" content="https://sashacarliroy-dev.github.io/meetly/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Meetly — Count me in.">
<meta name="twitter:description" content="Find the people you need to complete your group — padel, football, board games, and more.">
<meta name="twitter:image" content="https://sashacarliroy-dev.github.io/meetly/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#14162B; --ink2:#2A2D45; --paper:#FFFFFF; --mist:#F3F4F8; --mist2:#E7E9F0;
    --slate:#6E7180; --court:#F5A623; --court-dark:#D6900F; --coral:#FF5C4D;
    --coral-soft:#FFE4E0; --court-soft:#FFF1DC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{font-family:'Manrope',sans-serif; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased;}
  .fd{font-family:'Space Grotesk',sans-serif;}
  img{display:block;}
  button, input, textarea, select{font-family:inherit;}
  ::-webkit-scrollbar{width:0;height:0;}
  a{text-decoration:none;color:inherit;}

  @keyframes popIn{0%{transform:scale(.85);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes floatCard{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  @keyframes slideUp{0%{transform:translateY(16px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
  @keyframes toastIn{0%{transform:translate(-50%,40px);opacity:0;}100%{transform:translate(-50%,0);opacity:1;}}
  .anim-pop{animation:popIn .35s cubic-bezier(.2,1.4,.4,1) both;}
  .anim-float{animation:floatCard 6s ease-in-out infinite;}
  .anim-slideup{animation:slideUp .5s ease both;}
  .anim-toast{animation:toastIn .35s cubic-bezier(.2,1.4,.4,1) both;}

  /* ---------- layout helpers ---------- */
  .wrap{max-width:1152px; margin:0 auto;}
  .px{padding-left:24px; padding-right:24px;}
  @media(min-width:768px){.px{padding-left:40px; padding-right:40px;}}
  .hide-mobile{display:none;}
  @media(min-width:768px){.hide-mobile{display:flex;}}
  .hide-desktop{display:block;}
  @media(min-width:768px){.hide-desktop{display:none;}}
  .mobile-top-controls{display:flex;}
  @media(min-width:768px){.mobile-top-controls{display:none;}}

  /* ---------- top nav ---------- */
  #topnav{position:sticky; top:0; z-index:30; align-items:center; justify-content:space-between;
    padding:18px 40px; background:rgba(255,255,255,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--mist2);}
  .logo{display:flex; align-items:center; gap:8px; cursor:pointer; background:none; border:none;}
  .logo-mark{display:flex; align-items:center; justify-content:center; font-weight:700; width:38px; height:38px;
    background:var(--ink); color:var(--court); border-radius:12px; transform:rotate(-6deg); font-size:19px;}
  .logo-word{font-size:21px; font-weight:700;}
  .nav-pills{display:flex; align-items:center; gap:2px; background:var(--mist); border-radius:999px; padding:4px;}
  .nav-pill{display:flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; font-size:14px; font-weight:600;
    background:transparent; color:var(--slate); border:none; cursor:pointer; transition:.15s;}
  .nav-pill.active{background:var(--ink); color:var(--court);}
  .nav-right{display:flex; align-items:center; gap:14px;}
  .nav-avatar{width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid var(--ink); cursor:pointer;}

  /* ---------- language switcher ---------- */
  .lang-select{appearance:none; -webkit-appearance:none; background:var(--mist); color:var(--ink);
    border:none; border-radius:999px; padding:9px 34px 9px 14px; font-size:13.5px; font-weight:700; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236E7180' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; background-size:14px;}
  .lang-select-floating{position:fixed; top:14px; right:14px; z-index:35;}
  .lang-select-floating .lang-select{background-color:var(--paper); box-shadow:0 8px 20px -10px rgba(20,22,43,.35); border:1px solid var(--mist2);}

  /* ---------- bottom nav ---------- */
  #bottomnav{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; justify-content:space-around;
    align-items:center; padding:8px 4px; background:var(--paper); border-top:1px solid var(--mist2);}
  @media(min-width:768px){#bottomnav{display:none;}}
  .bn-item{display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; border-radius:12px; flex:1;
    background:none; border:none; cursor:pointer;}
  .bn-item svg{width:20px;height:20px;}
  .bn-label{font-size:10px; font-weight:700;}
  .nav-badge{position:absolute; top:-4px; right:-4px; background:var(--coral); color:var(--paper); font-size:10px; font-weight:800;
    min-width:16px; height:16px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px; border:2px solid var(--paper);}
  .nav-badge-mobile{position:absolute; top:2px; right:14%;}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:700; border-radius:10px;
    padding:14px 24px; cursor:pointer; border:none; font-size:14.5px; transition:transform .15s;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--ink); color:var(--court); box-shadow:0 8px 20px -8px rgba(20,22,43,.6);}
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed; transform:none;}
  .btn-secondary{background:transparent; border:2px solid var(--ink); color:var(--ink);}
  .btn-secondary:hover{transform:translateY(-2px);}
  .btn-full{width:100%;}

  /* ---------- pills / badges ---------- */
  .pill{display:inline-flex; align-items:center; gap:4px; padding:5px 11px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap;}

  /* ---------- avatars ---------- */
  .avatar-stack{display:flex; align-items:center;}
  .avatar-stack img{width:32px; height:32px; border-radius:50%; object-fit:cover; border:2px solid var(--paper); margin-left:-10px;}
  .avatar-stack img:first-child{margin-left:0;}
  .avatar-extra{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; background:var(--mist2); color:var(--ink2); border:2px solid var(--paper); margin-left:-10px;}


  /* ---------- rotating sport photo (real crossfade, two stacked layers) ---------- */
  .photo-rotator{position:absolute; inset:0; z-index:0; overflow:hidden;}
  .photo-layer{position:absolute; inset:0; background-size:cover; background-position:center 30%; transition:opacity 1.6s ease-in-out;}
  .photo-layer-a{opacity:1; z-index:1;}
  .photo-layer-b{opacity:0; z-index:2;}
  .photo-overlay{position:absolute; inset:0; z-index:3;}
  .photo-content{position:relative; z-index:4;}

  /* ---------- hero ---------- */
  .hero{padding:40px 24px 64px; display:grid; gap:48px; align-items:center; position:relative; overflow:hidden;}
  @media(min-width:768px){.hero{grid-template-columns:1fr 1fr; padding:64px 40px 96px;}}
  .hero h1{font-size:clamp(2.4rem,5.5vw,4rem); line-height:1.05; font-weight:700; margin-top:20px; letter-spacing:-0.02em;}
  .hero p{margin-top:20px; font-size:18px; color:var(--slate); max-width:420px;}
  .hero-btns{display:flex; flex-wrap:wrap; gap:12px; margin-top:32px;}
  .hero-visual{position:relative; height:320px; display:flex; align-items:center; justify-content:center;}
  @media(min-width:768px){.hero-visual{height:380px;}}
  .hero-blob{position:absolute; width:260px; height:260px; background:var(--court); border-radius:2rem; transform:rotate(3deg); opacity:0.9;}
  @media(min-width:768px){.hero-blob{width:320px; height:320px;}}
  .float-card{position:relative; border-radius:12px; padding:20px; width:256px; background:var(--paper); box-shadow:0 4px 12px -4px rgba(20,22,43,.15), 0 40px 70px -24px rgba(20,22,43,.5); border:1px solid rgba(20,22,43,.04);}
  .float-card-top{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .float-card-icon{width:40px; height:40px; border-radius:12px; background:var(--mist); display:flex; align-items:center; justify-content:center; font-size:18px;}
  .float-card-name{font-weight:600; font-size:14px;}
  .float-card-meta{font-size:12px; color:var(--slate);}
  .float-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .float-count{font-weight:700; font-size:14px;}

  /* ---------- how it works ---------- */
  .howsec{padding:64px 24px; position:relative; overflow:hidden; color:var(--paper);}
  @media(min-width:768px){.howsec{padding:64px 40px;}}
  .howsec h2{text-align:center; font-size:clamp(1.8rem,4vw,2.5rem); font-weight:700; letter-spacing:-0.015em;}
  .steps{display:grid; gap:24px; margin-top:48px;}
  @media(min-width:768px){.steps{grid-template-columns:repeat(3,1fr);}}
  .step-card{background:var(--ink2); border-radius:12px; padding:28px;}
  .step-num{width:48px; height:48px; border-radius:10px; background:var(--court); color:var(--ink); display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:18px; margin-bottom:20px;}
  .step-title{font-size:20px; font-weight:700; margin-bottom:8px;}
  .step-text{font-size:14px; color:#B9BBCB; line-height:1.5;}

  /* ---------- section titles ---------- */
  .section{padding:64px 24px; }
  @media(min-width:768px){.section{padding:64px 40px;}}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:32px;}
  .section-head h2{font-size:2rem; font-weight:700; letter-spacing:-0.015em;}
  .see-all{display:none; align-items:center; gap:4px; font-weight:600; font-size:14px; background:none; border:none; cursor:pointer;}
  @media(min-width:640px){.see-all{display:flex;}}

  /* ---------- grid of cards ---------- */
  .cards-grid{display:grid; gap:20px; grid-template-columns:repeat(auto-fill, minmax(240px,1fr));}

  /* ---------- activity card ---------- */
  .a-card{border-radius:12px; overflow:hidden; background:var(--paper); border:1px solid var(--mist2);
    box-shadow:0 4px 10px -4px rgba(20,22,43,.10), 0 16px 32px -20px rgba(20,22,43,.45); cursor:pointer; display:flex; flex-direction:column; transition:transform .18s, box-shadow .18s;}
  .a-card:hover{transform:translateY(-4px); box-shadow:0 8px 16px -6px rgba(20,22,43,.14), 0 22px 40px -18px rgba(20,22,43,.5);}
  .a-card-top{padding:20px 20px 0; display:flex; align-items:flex-start; gap:10px;}
  .a-card-icon{width:44px; height:44px; border-radius:10px; background:var(--mist); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
  .a-card-name{font-family:'Space Grotesk'; font-weight:600; font-size:15px;}
  .a-card-loc{font-size:12px; color:var(--slate); display:flex; align-items:center; gap:4px; margin-top:2px;}
  .a-card-badges{display:flex; flex-wrap:wrap; gap:6px; padding:12px 20px 0;}
  .a-card-meta{display:flex; gap:16px; padding:16px 20px 0; font-size:13px; color:var(--ink2);}
  .a-card-meta span{display:flex; align-items:center; gap:6px;}
  .a-card-bottom{display:flex; align-items:center; justify-content:space-between; padding:16px 20px 20px; font-weight:700; font-size:14px;}
  .a-card-btn{margin:0 20px 20px; border-radius:10px; padding:12px; text-align:center; font-weight:700; font-size:14px; border:none; cursor:pointer;}

  /* ---------- explore filters ---------- */
  .filters-box{background:var(--mist); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:12px;}
  @media(min-width:768px){.filters-box{flex-direction:row;}}
  .search-input-wrap{display:flex; align-items:center; gap:8px; background:var(--paper); border-radius:10px; padding:14px 18px; flex:1;}
  .search-input-wrap input{border:none; outline:none; background:none; font-size:14px; flex:1; color:var(--ink);}
  .avail-toggle{display:flex; align-items:center; justify-content:center; gap:8px; border-radius:10px; padding:14px 18px;
    font-weight:700; font-size:14px; border:none; cursor:pointer; white-space:nowrap;}
  .cat-scroll{display:flex; gap:8px; overflow-x:auto; margin-top:16px; padding-bottom:8px;}
  .cat-chip{flex-shrink:0; display:flex; align-items:center; gap:6px; padding:9px 16px; border-radius:999px; font-weight:700; font-size:13.5px;
    background:var(--mist); color:var(--ink2); border:none; cursor:pointer; white-space:nowrap;}
  .cat-chip.active{background:var(--ink); color:var(--court);}
  .results-count{margin:8px 0 16px; font-weight:700; font-size:13.5px; color:var(--slate);}
  .empty-box{background:var(--mist); border-radius:12px; text-align:center; padding:80px 20px;}
  .empty-emoji{font-size:40px; margin-bottom:12px;}
  .empty-title{font-family:'Space Grotesk'; font-weight:600; font-size:18px;}
  .empty-text{font-size:14px; color:var(--slate); margin-top:4px;}

  /* ---------- create form ---------- */
  .form-wrap{max-width:560px; margin:0 auto; padding:40px 24px 80px;}
  .field{margin-bottom:22px;}
  .field label{display:block; font-weight:700; font-size:14px; margin-bottom:8px;}
  .field input, .field textarea{width:100%; background:var(--mist); border:none; border-radius:10px; padding:14px 17px; font-size:14.5px; outline:none; color:var(--ink);}
  .field textarea{resize:none;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .cat-picker{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  @media(min-width:480px){.cat-picker{grid-template-columns:repeat(5,1fr);}}
  .cat-pick-btn{display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 4px; border-radius:10px; border:none; cursor:pointer;
    background:var(--mist); color:var(--ink2); font-weight:700; font-size:11px;}
  .cat-pick-btn.sel{background:var(--ink); color:var(--court);}
  .cat-pick-btn span{font-size:18px;}
  .stepper{display:flex; align-items:center; gap:12px;}
  .stepper button{width:40px; height:40px; border-radius:12px; background:var(--mist); border:none; font-weight:700; font-size:18px; cursor:pointer;}
  .stepper span{font-family:'Space Grotesk'; font-weight:700; font-size:18px; width:24px; text-align:center;}
  .price-wrap{display:flex; align-items:center; gap:6px; background:var(--mist); border-radius:10px; padding:0 17px;}
  .price-wrap input{background:none; border:none; padding:14px 0; font-size:14.5px; outline:none; flex:1;}
  .minmax-hint{font-size:12px; color:var(--slate); margin-top:8px; line-height:1.4;}
  .picker-scroll{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch;}
  .picker-chip{flex-shrink:0; background:var(--mist); border:none; color:var(--ink2); font-weight:700; font-size:13px; padding:10px 16px; border-radius:999px; cursor:pointer; white-space:nowrap;}
  .picker-chip.sel{background:var(--ink); color:var(--court);}
  .picker-manual{margin-top:8px; display:flex; align-items:center; gap:8px;}
  .picker-manual input{background:var(--mist); border:none; border-radius:10px; padding:10px 14px; font-size:13.5px; outline:none; width:110px; color:var(--ink);}
  .picker-manual-label{font-size:12px; color:var(--slate); font-weight:600;}

  /* ---------- confirmation ---------- */
  .confirm-wrap{max-width:460px; margin:0 auto; padding:64px 24px; text-align:center;}
  .confirm-emoji{width:64px; height:64px; border-radius:12px; margin:0 auto 20px; background:var(--court-soft); display:flex; align-items:center; justify-content:center; font-size:30px;}
  .confirm-title{font-size:2rem; font-weight:700; margin-bottom:8px;}
  .confirm-sub{color:var(--slate); margin-bottom:32px;}
  .confirm-btns{display:flex; gap:12px; margin-top:24px;}

  /* ---------- detail page ---------- */
  .detail-wrap{max-width:768px; margin:0 auto; padding:32px 24px 80px;}
  .back-btn{display:flex; align-items:center; gap:6px; font-weight:700; font-size:14px; color:var(--slate); background:none; border:none; cursor:pointer; margin-bottom:24px;}
  .detail-hero{border-radius:12px; padding:28px 32px; background:var(--ink); color:var(--paper);}
  .page-banner{border-radius:16px; padding:28px 24px; margin-bottom:24px; color:#fff; position:relative; overflow:hidden;}
  .page-banner h1{color:#fff;} .page-banner p{color:#E4E5EE;}
  .detail-hero-top{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .detail-hero-icon{width:56px; height:56px; border-radius:10px; background:var(--ink2); display:flex; align-items:center; justify-content:center; font-size:26px;}
  .detail-hero-name{font-family:'Space Grotesk'; font-weight:700; font-size:1.5rem;}
  .detail-hero-loc{font-size:14px; color:#B9BBCB; display:flex; align-items:center; gap:6px; margin-top:4px;}
  .detail-badges{display:flex; gap:6px; margin:20px 0;}
  .detail-meta{display:flex; flex-wrap:wrap; gap:20px; font-size:14px;}
  .detail-meta span{display:flex; align-items:center; gap:6px;}
  .detail-grid{display:grid; gap:20px; margin-top:32px;}
  @media(min-width:640px){.detail-grid{grid-template-columns:1fr 1fr;}}
  .detail-box{background:var(--mist); border-radius:12px; padding:24px;}
  .detail-box-label{font-weight:700; font-size:14px; color:var(--slate); margin-bottom:12px;}
  .detail-box-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .detail-host{background:var(--mist); border-radius:12px; padding:24px; margin-top:20px; display:flex; align-items:center; gap:12px;}
  .detail-host img{width:44px; height:44px; border-radius:50%; object-fit:cover;}
  .toast-inline{border-radius:10px; padding:12px; text-align:center; font-family:'Space Grotesk'; font-weight:600; background:var(--court-soft); color:#B5710A; margin-bottom:12px;}

  /* ---------- group confirmation progress ---------- */
  .progress-wrap{margin-top:14px;}
  .progress-track{position:relative; height:10px; background:var(--mist2); border-radius:999px; overflow:visible;}
  .progress-fill{height:100%; border-radius:999px; background:var(--court); transition:width .4s cubic-bezier(.2,1.4,.4,1);}
  .progress-min-marker{position:absolute; top:-4px; width:2px; height:18px; background:var(--ink);}
  .progress-labels{display:flex; justify-content:space-between; font-size:11px; color:var(--slate); margin-top:6px; font-weight:700;}
  .confirmby-row{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink2); margin-top:10px;}
  .payinfo-row{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--slate); margin-top:4px;}
  .host-panel{background:var(--coral-soft); border-radius:12px; padding:18px; margin-top:16px;}
  .host-panel-title{font-weight:700; font-size:13px; color:#B23A2E; margin-bottom:6px;}
  .host-panel-text{font-size:12.5px; color:#8a3128; margin-bottom:12px; line-height:1.5;}
  .btn-start-anyway{background:var(--ink); color:var(--court); border:none; border-radius:10px; padding:10px 16px; font-weight:700; font-size:13px; cursor:pointer;}
  .btn-text-danger{display:block; width:100%; text-align:center; background:none; border:none; color:var(--coral); font-weight:700; font-size:13.5px; padding:14px 0 4px; cursor:pointer;}

  /* ---------- chat modal ---------- */
  #chat-overlay{position:fixed; inset:0; z-index:40; display:none; align-items:flex-end; justify-content:center; background:rgba(20,22,43,.5);}
  @media(min-width:640px){#chat-overlay{align-items:center;}}
  #chat-overlay.open{display:flex;}
  .chat-panel{width:100%; max-width:420px; border-radius:12px 24px 0 0; padding:20px; background:var(--paper); max-height:80vh; display:flex; flex-direction:column;}
  @media(min-width:640px){.chat-panel{border-radius:12px; max-width:640px; max-height:85vh; padding:24px;}}
  @media(min-width:1024px){.chat-panel{max-width:760px; height:78vh; max-height:780px;}}
  .chat-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .chat-head-title{font-family:'Space Grotesk'; font-weight:600;}
  .chat-close{background:none; border:none; cursor:pointer;}
  .chat-msgs{overflow-y:auto; flex:1; max-height:45vh; margin-bottom:16px; display:flex; flex-direction:column; gap:12px;}
  @media(min-width:640px){.chat-msgs{max-height:none;}}
  .chat-msg{display:flex; align-items:flex-start; gap:8px;}
  .chat-msg img{width:32px; height:32px; border-radius:50%; object-fit:cover;}
  .bubble{background:var(--mist); border-radius:10px 16px 16px 4px; padding:9px 15px; font-size:14px; max-width:260px;}
  @media(min-width:640px){.bubble{max-width:420px;}}
  .bubble-name{font-size:11px; font-weight:700; color:var(--slate); margin-bottom:2px;}

/* ===================== DATA LOADING (Supabase) ===================== */
async function loadActivities(){
  if (!sbReady) { state.loading = false; return; }
  const { data, error } = await sb
    .from("activities")
    .select(`
      id, category, name, description, location, activity_date, activity_time,
      min_players, max_players, price, confirm_by, host_id, created_at,
      host:profiles!activities_host_id_fkey ( id, name, avatar_url ),
      participants ( user_id, profiles!participants_user_id_fkey ( id, name, avatar_url ) )
    `)
    .order("created_at", { ascending: false });

  if (error) { console.error("loadActivities error:", error); return; }

  activities = (data || []).map(row => ({
    id: row.id,
    category: row.category,
    name: row.name,
    description: row.description || "",
    location: row.location,
    date: row.activity_date,
    time: row.activity_time,
    min: row.min_players,
    max: row.max_players,
    price: Number(row.price) || 0,
    confirmBy: row.confirm_by || "",
    createdAt: row.created_at,
    host: row.host
      ? { id: row.host.id, name: row.host.name, avatar: row.host.avatar_url || avatarFor(row.host.id, row.host.name) }
      : { id: row.host_id, name: "?", avatar: avatarFor(row.host_id, "?") },
    participants: (row.participants || []).map(p => ({
      id: p.profiles?.id || p.user_id,
      name: p.profiles?.name || "?",
      avatar: p.profiles?.avatar_url || avatarFor(p.profiles?.id || p.user_id, p.profiles?.name || "?"),
    })),
    current: (row.participants || []).length,
  }));

  state.joinedIds = new Set(activities.filter(a => state.user && a.participants.some(p => p.id === state.user.id)).map(a => a.id));
  state.createdIds = new Set(activities.filter(a => state.user && a.host.id === state.user.id).map(a => a.id));

  // Fix: clear any unread-chat badge pointing to an activity that no longer exists (cancelled/deleted)
  const liveIds = new Set(activities.map(a => a.id));
  for(const id of Array.from(state.unreadChatActivityIds)){
    if(!liveIds.has(id)) state.unreadChatActivityIds.delete(id);
  }
  if(state.chatFor && !liveIds.has(state.chatFor)){
    closeChat();
  }
}

let realtimeChannel = null;
let knownActivityIds = new Set();
function subscribeRealtime(){
  if (!sbReady || realtimeChannel) return;
  realtimeChannel = sb.channel("joinup-live")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "activities" }, (payload) => { handleNewActivity(payload.new); })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "activities" }, async () => { await loadActivities(); render(); })
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "activities" }, async () => { await loadActivities(); render(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "participants" }, async () => { await loadActivities(); render(); })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => { handleGlobalChatMessage(payload.new); })
    .subscribe();
}
function handleGlobalChatMessage(row){
  if(!state.user || row.user_id === state.user.id) return; // ignore own messages
  const belongs = state.joinedIds.has(row.activity_id) || state.createdIds.has(row.activity_id);
  if(!belongs) return;
  const alreadyOpen = state.chatFor === row.activity_id && document.getElementById("chat-overlay")?.classList.contains("open");
  if(alreadyOpen) return; // the open chat's own live subscription already shows it
  state.unreadChatActivityIds.add(row.activity_id);
  const a = activities.find(x=>x.id===row.activity_id);
  showToast(`💬 ${t('newChatMsgToast')} — ${a?aName(a):""}`);
  render();
}
async function handleNewActivity(row){
  const isMine = state.user && row.host_id === state.user.id;
  await loadActivities();
  if(!isMine){
    showToast(`🎉 ${t('newActivityToast')} — ${row.name}`);
    if(state.page !== "explore" && state.page !== "home") state.unseenCount = (state.unseenCount||0) + 1;
  }
  render();
}

async function onAuthed(authUser){
  if (!sbReady) return;
  let { data: profile } = await sb.from("profiles").select("*").eq("id", authUser.id).single();
  state.user = {
    id: authUser.id,
    email: authUser.email,
    name: (profile && profile.name) || (authUser.email || "").split("@")[0],
    bio: (profile && profile.bio) || "",
    avatar: (profile && profile.avatar_url) || avatarFor(authUser.id, (profile && profile.name) || authUser.email),
  };
  await loadActivities();
  render();
}
async function initAuth(){
  if (!sbReady) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session) await onAuthed(session.user);
  sb.auth.onAuthStateChange(async (_event, session) => {
    if (session) { await onAuthed(session.user); }
    else { state.user = null; render(); }
  });
}

function pill(text,bg,fg){ return `<span class="pill" style="background:${bg};color:${fg}">${text}</span>`; }
function isConfirmed(a){ return a.forcedConfirmed || a.current >= (a.min||a.max); }
function editMinutesLeft(a){
  if(!a.createdAt) return 0;
  const elapsed = Date.now() - new Date(a.createdAt).getTime();
  const left = 60 - Math.floor(elapsed/60000);
  return Math.max(0, left);
}
function isExpired(a){
  if(!a.confirmBy) return false;
  const dt = new Date(a.confirmBy);
  if(isNaN(dt.getTime())) return false;
  return Date.now() > dt.getTime() && !isConfirmed(a) && a.current < a.max;
}

/* ===================== DATE/TIME PICKERS ===================== */
const LOCALE_MAP = { en:"en-GB", fr:"fr-FR", es:"es-ES" };
function localISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function dayOptions(count=14){
  const out = [];
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<count;i++){
    const d = new Date(today); d.setDate(today.getDate()+i);
    const iso = localISODate(d);
    let label;
    if(i===0) label = t('todayLabel');
    else if(i===1) label = t('tomorrowLabel');
    else label = new Intl.DateTimeFormat(LOCALE_MAP[state.lang]||"en-GB", { weekday:"short", day:"numeric" }).format(d);
    out.push({ value: iso, label });
  }
  return out;
}
function timeOptions(){
  const out = [];
  for(let h=7; h<=23; h++){
    out.push(`${String(h).padStart(2,"0")}:00`);
    out.push(`${String(h).padStart(2,"0")}:30`);
  }
  return out;
}
function fmtDateLabel(iso){
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso || "";
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(iso+"T00:00:00");
  const diffDays = Math.round((d-today)/86400000);
  if(diffDays===0) return t('todayLabel');
  if(diffDays===1) return t('tomorrowLabel');
  return new Intl.DateTimeFormat(LOCALE_MAP[state.lang]||"en-GB", { weekday:"short", day:"numeric", month:"short" }).format(d);
}
function dayScrollerHTML(days, selected, onSelectFn){
  return `<div class="picker-scroll">${days.map(d=>`
    <button type="button" class="picker-chip ${selected===d.value?'sel':''}" onclick="${onSelectFn}('${d.value}')">${esc(d.label)}</button>
  `).join("")}</div>`;
}
function timeScrollerHTML(times, selected, onSelectFn){
  return `<div class="picker-scroll">${times.map(tm=>`
    <button type="button" class="picker-chip ${selected===tm?'sel':''}" onclick="${onSelectFn}('${tm}')">${tm}</button>
  `).join("")}</div>`;
}

function getBadges(a){
  const full = a.current >= a.max; const confirmed = isConfirmed(a); const expired = isExpired(a);
  const out=[];
  if(full) out.push(pill(t('badgeFull'),"var(--ink)","var(--paper)"));
  else if(expired) out.push(pill(t('badgeExpired'),"var(--slate)","var(--paper)"));
  else if(confirmed) out.push(pill(t('confirmedBadge'),"var(--court)","var(--ink)"));
  else out.push(pill(t('neededToConfirm', (a.min||a.max)-a.current),"var(--coral)","var(--paper)"));
  const isNew = a.createdAt && (Date.now() - new Date(a.createdAt).getTime()) < 86400000;
  if(isNew) out.push(pill(t('badgeNew'),"var(--mist2)","var(--ink2)"));
  if(a.popular && !full) out.push(pill(t('badgePopular'),"var(--court-soft)","#B5710A"));
  return out.join("");
}
function spotsText(a){
  const r=a.max-a.current;
  if(r<=0) return t('badgeFull');
  if(isExpired(a)) return t('badgeExpired');
  return isConfirmed(a) ? t('confirmedBadge') : t('neededToConfirm', (a.min||a.max)-a.current);
}
function avatarStack(people, max=4){
  const shown = people.slice(0,max); const extra = people.length-shown.length;
  return `<div class="avatar-stack">${shown.map(p=>`<img src="${p.avatar}" title="${esc(p.name)}" style="cursor:pointer;" onclick="event.stopPropagation(); viewProfile('${p.id}')">`).join("")}${extra>0?`<div class="avatar-extra">+${extra}</div>`:""}</div>`;
}

/* ===================== ADMIN STATS ===================== */
async function loadStatsData(){
  if(!sbReady) return;
  const { data: profilesData, error } = await sb.from("profiles").select("id, created_at");
  if(error){ console.error(error); return; }
  const now = Date.now();
  const sevenDaysAgo = now - 7*86400000;

  const totalUsers = (profilesData||[]).length;
  const newUsers7d = (profilesData||[]).filter(p => p.created_at && new Date(p.created_at).getTime() > sevenDaysAgo).length;

  const totalActivities = activities.length;
  const newActivities7d = activities.filter(a => a.createdAt && new Date(a.createdAt).getTime() > sevenDaysAgo).length;

  const byCategory = {};
  CATEGORIES.forEach(c => byCategory[c.id] = 0);
  activities.forEach(a => { byCategory[a.category] = (byCategory[a.category]||0) + 1; });

  let confirmedCount=0, expiredCount=0, fullCount=0, pendingCount=0;
  activities.forEach(a => {
    if(a.current>=a.max) fullCount++;
    else if(isExpired(a)) expiredCount++;
    else if(isConfirmed(a)) confirmedCount++;
    else pendingCount++;
  });

  const hostCounts = {};
  activities.forEach(a => { const n=a.host?.name||"?"; hostCounts[n]=(hostCounts[n]||0)+1; });
  const topHosts = Object.entries(hostCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const joinCounts = {};
  activities.forEach(a => (a.participants||[]).forEach(p => { joinCounts[p.name]=(joinCounts[p.name]||0)+1; }));
  const topJoiners = Object.entries(joinCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  state.statsData = { totalUsers, newUsers7d, totalActivities, newActivities7d, byCategory, confirmedCount, expiredCount, fullCount, pendingCount, topHosts, topJoiners };
  render();
}

        <div class="recent-row">
          <div class="recent-icon">${catInfo(a.category).emoji}</div>
          <div style="flex:1;"><div class="recent-name">${esc(aName(a))}</div><div class="recent-meta">${esc(aDate(a))} · ${esc(a.location)}</div></div>
          ${state.createdIds.has(a.id) ? pill(t('hostingPill'),"var(--court-soft)","#B5710A") : pill(t('joinedPill'),"var(--mist2)","var(--ink2)")}
        </div>`).join("")}
  </div>`;
}

function startEditProfile(){
  state.editingProfile = true;
  state.profileForm = { name: state.user.name, bio: state.user.bio || "", avatarPreview: null, avatarFile: null, busy: false };
  render();
}
function cancelEditProfile(){
  state.editingProfile = false;
  render();
}
function onAvatarFileChosen(input){
  const file = input.files && input.files[0];
  if(!file) return;
  state.profileForm.avatarFile = file;
  const reader = new FileReader();
  reader.onload = (e) => { state.profileForm.avatarPreview = e.target.result; render(); };
  reader.readAsDataURL(file);
}
async function saveProfile(){
  if(!state.user || !sbReady) return;
  state.profileForm.busy = true; render();
  let avatarUrl = state.user.avatar;
  if(state.profileForm.avatarFile){
    const file = state.profileForm.avatarFile;
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    const path = `${state.user.id}/avatar.${ext}`;
    const { error: upErr } = await sb.storage.from("avatars").upload(path, file, { upsert: true });
    if(upErr){ console.error(upErr); showToast(t('genericError')); state.profileForm.busy=false; render(); return; }
    const { data: pub } = sb.storage.from("avatars").getPublicUrl(path);
    avatarUrl = pub.publicUrl + "?t=" + Date.now();
  }
  const { error } = await sb.from("profiles").update({
    name: state.profileForm.name || state.user.name,
    bio: state.profileForm.bio || "",
    avatar_url: avatarUrl,
  }).eq("id", state.user.id);
  state.profileForm.busy = false;
  if(error){ console.error(error); showToast(t('genericError')); render(); return; }
  state.user.name = state.profileForm.name || state.user.name;
  state.user.bio = state.profileForm.bio || "";
  state.user.avatar = avatarUrl;
  state.editingProfile = false;
  showToast(t('profileSaved'));
  await loadActivities();
  render();
}

/* ===================== RENDER / ROUTER ===================== */
function render(){
  renderNav();
  renderAuthSlot();
  const root = document.getElementById("page-root");
  const pages = {home:pageHome, explore:pageExplore, create:pageCreate, detail:pageDetail, my:pageMy, profile:pageProfile, editActivity:pageEditActivity, privacy:pagePrivacy, stats:pageStats, viewProfile:pageViewProfile};
  root.innerHTML = (pages[state.page] || pageHome)();
  const chatDraft = document.getElementById("chat-draft");
  if(chatDraft) chatDraft.placeholder = t('chatPlaceholder');
  const privacyLink = document.getElementById("privacy-link");
  if(privacyLink) privacyLink.textContent = t('privacyLinkLabel');
}

function go(page, id){
  if(id) state.selectedId = id;
  if(page!=="create") state.createdConfirmation = null;
  if((page==="create" || page==="my" || page==="profile") && !state.user){ openAuthModal(); return; }
  if(page==="stats" && (!state.user || state.user.email !== ADMIN_EMAIL)){ return; }
  if(page==="explore" || page==="home") state.unseenCount = 0;
  state.page = page;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
  if(page==="stats"){ state.statsData = null; loadStatsData(); }
}

/* ===================== ACTIONS ===================== */
async function joinActivity(id){
  if(!state.user){ openAuthModal(); return; }
  const a = activities.find(x=>x.id===id);
  if(!a || a.current>=a.max || isExpired(a)) return;
  const { error } = await sb.from("participants").insert({ activity_id:id, user_id: state.user.id });
  if(error){
    console.error(error);
    if((error.message||"").includes("ACTIVITY_FULL")){ showToast(t('justFilledUp')); await loadActivities(); render(); }
    else { showToast(t('genericError')); }
    return;
  }
  state.joinedIds.add(id);
  state.justJoinedId = id;
  showToast(t('youreIn'));
  await loadActivities();
  render();
  setTimeout(()=>{ state.justJoinedId=null; if(state.page==="detail") render(); }, 3000);
}
async function leaveActivity(id){
  if(!state.user) return;
  if(!confirm(t('confirmLeave'))) return;
  const { error } = await sb.from("participants").delete().eq("activity_id", id).eq("user_id", state.user.id);
  if(error){ console.error(error); showToast(t('genericError')); return; }
  state.joinedIds.delete(id);
  showToast(t('leftActivity'));
  await loadActivities();
  go("explore");
}
async function cancelActivity(id){
  if(!state.user) return;
  if(!confirm(t('confirmCancel'))) return;
  const { error } = await sb.from("activities").delete().eq("id", id);
  if(error){ console.error(error); showToast(t('genericError')); return; }
  state.createdIds.delete(id); state.joinedIds.delete(id);
  showToast(t('activityCancelled'));
  await loadActivities();
  go("my");
}
function startAnyway(id){
  const a = activities.find(x=>x.id===id);
  if(!a) return;
  a.forcedConfirmed = true;
  render();
}
function setFormField(k,v){
  state.createForm[k]=v;
  if(k==="category"){ render(); return; }
  const btn = document.getElementById('create-submit-btn');
  if(btn){ const f=state.createForm; btn.disabled = !(f.category&&f.name&&f.date&&f.time&&f.location); }
}
function selectFormDate(v){ setFormField('date', v); render(); }
function selectFormTime(v){ setFormField('time', v); render(); }
function selectConfirmByDate(v){ setFormField('confirmByDate', v); render(); }
function selectConfirmByTime(v){ setFormField('confirmByTime', v); render(); }
function stepNeed(delta){
  state.createForm.need = Math.max(2, state.createForm.need + delta);
  if(state.createForm.min > state.createForm.need) state.createForm.min = state.createForm.need;
  render();
}
function stepMin(delta){
  state.createForm.min = Math.max(2, Math.min(state.createForm.need, state.createForm.min + delta));
  render();
}
async function submitCreate(){
  if(!state.user){ openAuthModal(); return; }
  const f = state.createForm;
  if(!(f.category&&f.name&&f.date&&f.time&&f.location)) return;
  // Build a real, comparable ISO datetime for the confirm-by deadline (defaults to the activity's own date/time if left blank)
  const confirmByDate = f.confirmByDate || f.date;
  const confirmByTime = f.confirmByTime || f.time;
  const confirmByISO = `${confirmByDate}T${confirmByTime}:00`;
  const { data, error } = await sb.from("activities").insert({
    category:f.category, name:f.name, description:f.description||"", location:f.location,
    activity_date:f.date, activity_time:f.time,
    min_players:Number(f.min)||2, max_players:Number(f.need),
    price:Number(f.price)||0, confirm_by:confirmByISO, host_id: state.user.id,
  }).select().single();
  if(error){
    console.error(error);
    if((error.message||"").includes("RATE_LIMITED")) showToast(t('rateLimited'));
    else showToast(t('genericError'));
    return;
  }
  const { error: joinErr } = await sb.from("participants").insert({ activity_id:data.id, user_id: state.user.id });
  if(joinErr) console.error(joinErr);
  await loadActivities();
  state.createdConfirmation = activities.find(a=>a.id===data.id) || null;
  state.createForm = {category:"", name:"", date:"", time:"", location:"", need:4, min:4, confirmByDate:"", confirmByTime:"", price:"", description:""};
  render();
}
function startEditActivity(id){
  const a = activities.find(x=>x.id===id);
  if(!a || editMinutesLeft(a)<=0) return;
  const cbDate = (a.confirmBy||"").split("T")[0] || a.date;
  const cbTime = (a.confirmBy||"").split("T")[1] ? a.confirmBy.split("T")[1].slice(0,5) : a.time;
  state.editForm = {
    category:a.category, name:a.name, date:a.date, time:a.time, location:a.location,
    need:a.max, min:a.min, confirmByDate:cbDate, confirmByTime:cbTime,
    price:String(a.price||""), description:a.description||"", busy:false,
  };
  state.selectedId = id;
  state.page = "editActivity";
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function setEditFormField(k,v){ state.editForm[k]=v; render(); }
function selectEditDate(v){ setEditFormField('date', v); }
function selectEditTime(v){ setEditFormField('time', v); }
function selectEditConfirmByDate(v){ setEditFormField('confirmByDate', v); }
function selectEditConfirmByTime(v){ setEditFormField('confirmByTime', v); }
function stepEditNeed(delta){
  state.editForm.need = Math.max(2, state.editForm.need + delta);
  if(state.editForm.min > state.editForm.need) state.editForm.min = state.editForm.need;
  render();
}
function stepEditMin(delta){
  state.editForm.min = Math.max(2, Math.min(state.editForm.need, state.editForm.min + delta));
  render();
}
async function saveEditActivity(){
  const id = state.selectedId; const f = state.editForm;
  if(!f || !(f.category&&f.name&&f.date&&f.time&&f.location)) return;
  const a = activities.find(x=>x.id===id);
  if(!a || editMinutesLeft(a)<=0){ showToast(t('genericError')); return; }
  f.busy = true; render();
  const confirmByISO = `${f.confirmByDate||f.date}T${f.confirmByTime||f.time}:00`;
  const { error } = await sb.from("activities").update({
    category:f.category, name:f.name, description:f.description||"", location:f.location,
    activity_date:f.date, activity_time:f.time,
    min_players:Number(f.min)||2, max_players:Number(f.need),
    price:Number(f.price)||0, confirm_by:confirmByISO,
  }).eq("id", id);
  f.busy = false;
  if(error){
    console.error(error);
    if((error.message||"").includes("EDIT_WINDOW_CLOSED")) showToast(t('editWindowClosed'));
    else showToast(t('genericError'));
    render(); return;
  }
  showToast(t('activityUpdated'));
  await loadActivities();
  go("detail", id);
}
function setSearch(v){ state.q=v; render(); const inp=document.querySelector('.search-input-wrap input'); if(inp){ inp.focus(); inp.selectionStart=inp.selectionEnd=inp.value.length; } }
function setCat(c){ state.cat=c; render(); }
function toggleAvailable(){ state.onlyAvailable=!state.onlyAvailable; render(); }
function setMyTab(tb){ state.myTab=tb; render(); }

/* chat — real, shared, backed by Supabase (messages table) */
let chatChannel = null;
async function openChat(id){
  if(!state.user){ openAuthModal(); return; }
  state.chatFor = id;
  state.unreadChatActivityIds.delete(id);
  document.getElementById("chat-title").textContent = aName(activities.find(x=>x.id===id)) + " · " + t('chatSuffix');
  document.getElementById("chat-msgs").innerHTML = `<div style="text-align:center; font-size:12.5px; color:var(--slate); padding:20px 0;">${esc(t('sending'))}</div>`;
  document.getElementById("chat-overlay").classList.add("open");
  await loadChatMessages(id);
  subscribeChat(id);
}
async function loadChatMessages(id){
  if(!sbReady) return;
  const { data, error } = await sb
    .from("messages")
    .select("id, text, created_at, user_id, profiles!messages_user_id_fkey(name, avatar_url)")
    .eq("activity_id", id)
    .order("created_at", { ascending: true });
  if(error){ console.error(error); return; }
  state.chatMessages[id] = (data||[]).map(m => ({
    id: m.user_id,
    from: m.profiles?.name || "?",
    avatar: m.profiles?.avatar_url || avatarFor(m.user_id, m.profiles?.name),
    text: m.text,
  }));
  renderChat();
}
function subscribeChat(id){
  if(chatChannel){ sb.removeChannel(chatChannel); chatChannel = null; }
  if(!sbReady) return;
  chatChannel = sb.channel(`chat-${id}`)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `activity_id=eq.${id}` },
      async () => { await loadChatMessages(id); })
    .subscribe();
}
function closeChat(){
  document.getElementById("chat-overlay").classList.remove("open");
  if(chatChannel){ sb.removeChannel(chatChannel); chatChannel = null; }
}
function renderChat(){
  const msgs = state.chatMessages[state.chatFor] || [];
  const el = document.getElementById("chat-msgs");
  el.innerHTML = msgs.length ? msgs.map(m=>`
    <div class="chat-msg"><img src="${m.avatar}" style="cursor:pointer;" onclick="viewProfile('${m.id}')"><div class="bubble"><div class="bubble-name" style="cursor:pointer;" onclick="viewProfile('${m.id}')">${esc(m.from)}</div>${esc(m.text)}</div></div>
  `).join("") : `<div style="text-align:center; font-size:12.5px; color:var(--slate); padding:20px 0;">${esc(t('nothingYet'))}</div>`;
  el.scrollTop = el.scrollHeight;
}
async function sendChat(){
  const inp = document.getElementById("chat-draft");
  if(!inp.value.trim() || !state.user || !sbReady) return;
  const text = inp.value;
  inp.value = "";
  const { error } = await sb.from("messages").insert({ activity_id: state.chatFor, user_id: state.user.id, text });
  if(error){ console.error(error); showToast(t('genericError')); return; }
  await loadChatMessages(state.chatFor);
}

/* toast */
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display="block"; el.classList.add("anim-toast");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ el.style.display="none"; el.classList.remove("anim-toast"); }, 2200);
}

/* ===================== ROTATING SPORT PHOTO BACKGROUND (real crossfade) ===================== */
const SPORT_PHOTOS = [
  "https://images.unsplash.com/photo-1646649851780-d9701b7c3c04?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", // padel
  "https://images.unsplash.com/photo-1535132011086-b8818f016104?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", // golf
  "https://images.unsplash.com/photo-1629460444247-0964515d45e1?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", // surf
  "https://images.unsplash.com/photo-1752681304917-453df272eed7?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTh8fHNwb3J0cyUyMGFjdGlvbnxlbnwwfHwwfHx8MA%3D%3D", // football
  "https://images.unsplash.com/photo-1512746804203-e53e69406f93?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTF8fHNwb3J0cyUyMGFjdGlvbnxlbnwwfHwwfHx8MA%3D%3D", // basketball
];
let sportPhotoIndex = 0;
function crossfadeSportPhotos(){
  sportPhotoIndex = (sportPhotoIndex + 1) % SPORT_PHOTOS.length;
  const nextUrl = SPORT_PHOTOS[sportPhotoIndex];
  document.querySelectorAll(".photo-rotator").forEach(r => {
    const a = r.querySelector(".photo-layer-a");
    const b = r.querySelector(".photo-layer-b");
    if(!a || !b) return;
    b.style.backgroundImage = `url('${nextUrl}')`;
    void b.offsetWidth; // force reflow so the opacity transition actually runs
    b.style.opacity = "1";
    setTimeout(() => {
      a.style.backgroundImage = `url('${nextUrl}')`;
      a.style.opacity = "1";
      b.style.opacity = "0";
    }, 1600);
  });
}
function startSportPhotoRotation(){
  setInterval(crossfadeSportPhotos, 10000);
}
startSportPhotoRotation();

document.documentElement.lang = state.lang;
(async function init(){
  await loadActivities();
  render();
  subscribeRealtime();
  await initAuth();
})();
</script>
